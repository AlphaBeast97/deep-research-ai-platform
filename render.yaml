# Render Blueprint — MAD Researcher (the §22.5 proposal, on the free tiers).
# Dashboard → New → Blueprint → this repo. Secrets are `sync: false`, so Render
# prompts for them on first sync and nothing sensitive lands in git.
#
# `plan: free` is not optional: an omitted plan defaults to 0.5c-512mb, which is
# the paid tier. Static sites have no plan and never sleep.
#
# Free tier caveat: the API sleeps after 15 idle minutes (~1 min wake). Pre-warm it
# before a demo. A deploy during a run kills that run — there is no resume.
#
# After the first sync, open the API's /api/health and confirm `missingKeys` is
# empty. If Render had to suffix a service name (it does that when a name is
# taken), the VITE_API_URL below is the one value that will need correcting.
#
# The behaviour block below is mirrored from the project's local backend/.env so
# the deploy runs exactly as it does in development. Three keys from that file are
# deliberately NOT here, because they are environment-specific or dead:
#   PORT          — Render injects it; config.js reads it.
#   CLIENT_ORIGIN — local dev uses http://localhost:5173; here it is derived.
#   MOCK_MODE     — deleted with mock mode (ADR-24); config.js never reads it.
#
# Demo day: lower RESEARCH_MAX_ROUNDS / RESEARCH_DEPTH here, then set them back.

services:
  # The API. One instance, long responses, health-checked.
  - type: web
    name: mad-researcher-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CLERK_PUBLISHABLE_KEY
        sync: false             # prompted for on first sync; never committed
      - key: CLERK_SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL       # your provider; empty means api.openai.com
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_MODEL_SMART
        value: gemini-3.5-flash-lite

      # ── Behaviour ────────────────────────────────────────────────
      # Mirrored from the local backend/.env so the deploy runs exactly as it
      # does in development. Every key here also has a default in config.js;
      # these are the values this project actually runs with.
      - key: LLM_JSON_MODE
        value: "true"
      - key: LLM_TIMEOUT_MS
        value: "600000"              # 10 min — wait for a streamed answer's first token
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_STREAM_IDLE_TIMEOUT_MS
        value: "180000"              # 3 min between tokens
      - key: TAVILY_MAX_RESULTS
        value: "5"
      - key: MAX_SUBQUESTIONS
        value: "6"
      - key: RESEARCH_DEPTH
        value: deep
      - key: RESEARCH_CONCURRENCY
        value: "6"                   # all six sub-questions at once
      - key: RUN_TIMEOUT_MS
        value: "1200000"             # 20 min ceiling on one run
      - key: RESEARCH_MAX_ROUNDS
        value: "2"
      - key: COVERAGE_FLOOR
        value: "60"
      - key: MAX_FOLLOWUP_QUERIES
        value: "2"
      - key: DEEP_FETCH
        value: "true"
      - key: DEEP_FETCH_SOURCES
        value: "3"
      - key: RESEARCH_CRITIQUE
        value: "true"
      - key: CRITIC_FULL_TEXT_SOURCES
        value: "16"

      # CORS requires the SPA's origin *exactly*, character for character. Rather
      # than hardcoding it (and having it drift whenever a service is renamed),
      # pull it from the static site's own URL. If it reads empty after the first
      # sync, run the Blueprint sync once more.
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: mad-researcher-web
          envVarKey: RENDER_EXTERNAL_URL

  # The SPA. Built with the API URL and Clerk key baked in at build time.
  - type: web
    name: mad-researcher-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the SPA at build time, so it must be the API's public URL.
      - key: VITE_API_URL
        value: https://mad-researcher-api.onrender.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
